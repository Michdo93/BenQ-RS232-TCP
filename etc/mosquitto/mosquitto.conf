# Mosquitto configuration for the BenQ projector Pi
# /etc/mosquitto/mosquitto.conf

pid_file /run/mosquitto/mosquitto.pid

persistence true
persistence_location /var/lib/mosquitto/

log_dest file /var/log/mosquitto/mosquitto.log

# Authentication (applies to all listeners)
password_file /etc/mosquitto/passwd
allow_anonymous false

# Unencrypted, only reachable from this Pi (used by benq_projector.py)
listener 1883 127.0.0.1

# Encrypted, reachable from the network (openHAB, other clients)
listener 8883
cafile /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/server.crt
keyfile /etc/mosquitto/certs/server.key
tls_version tlsv1.2

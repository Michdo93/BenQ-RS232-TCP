# BenQ projector MQTT service - configuration
# Copy to /etc/benq-projector/benq_projector.ini and adjust.

[projector]
# IP address (or hostname) of the projector and RS232-over-LAN port
host = 192.168.0.59
port = 8000
# Seconds to wait for a reply
timeout = 3.0
# Minimum pause between two commands (commands sent faster are dropped by the projector)
command_gap = 0.7
# Extra attempts for "=?" queries that got no reply
query_retries = 1
# Seconds after power on in which further commands are queued and sent afterwards
warmup_time = 60
# Seconds after power off in which commands are rejected (power on is queued)
cooldown_time = 90
# Seconds to wait before reconnecting after a connection error
reconnect_delay = 10

[mqtt]
host = localhost
port = 1883
# Leave username empty for anonymous access
username = mqtt
password = mqtt
client_id = benq-projector
# All topics start with this prefix
base_topic = projector/benq/mh856ust
qos = 1
keepalive = 60

[polling]
# Seconds between power state queries
power_interval = 5
# Seconds between full status polls (only while the projector is on)
full_interval = 30

[logging]
# DEBUG, INFO, WARNING, ERROR
level = INFO
